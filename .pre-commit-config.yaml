repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  -  id: check-yaml
  -  id: end-of-file-fixer
  -  id: trailing-whitespace
  -  id: check-shebang-scripts-are-executable

- repo: https://github.com/FreeAndFair/commitlint-pre-commit-hook
  rev: v9.22.0
  hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

- repo: https://github.com/FreeAndFair/pre-commit-rust
  rev: v1.2.1
  hooks:
      # The trailing '--' is load-bearing: pre-commit appends the matched
      # file names to the hook's arguments, and `cargo fmt` rejects file
      # arguments — after '--' they are forwarded to rustfmt, which accepts
      # them. (Same pattern as the kernel repository's configuration.)
      - id: fmt
        args: ['--all', '--manifest-path', 'Cargo.toml', '--']
      - id: cargo-check
        args: ['--manifest-path', 'Cargo.toml']
      - id: clippy
        args: ['--manifest-path', 'Cargo.toml', '--', '-D', 'warnings']
        exclude: \.md
