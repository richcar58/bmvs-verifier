repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  -  id: check-yaml
  -  id: end-of-file-fixer
  -  id: trailing-whitespace
  -  id: check-shebang-scripts-are-executable

- repo: https://github.com/FreeAndFair/commitlint-pre-commit-hook
  rev: v9.22.0
  hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

# The Rust hooks (fmt, cargo-check, clippy) used by the VoteSecure kernel
# repository are added when the cargo workspace is scaffolded (bootstrap plan
# Phase 2/3); until a Cargo.toml exists here they would fail on every run.
