# .github/workflows/run-precommit-hooks.yml
# Adapted from the VoteSecure kernel repository's workflow of the same name.
#
# CI re-runs the full pre-commit hook suite so that locally bypassed hooks
# (git commit --no-verify) are still caught authoritatively. The Rust
# toolchain setup step returns here when the cargo workspace is scaffolded
# (bootstrap plan Phase 2/3) and the Rust pre-commit hooks are enabled.

name: Run pre-commit Hooks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  pre-commit:
    name: Run pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # rustup 1.28+ does not auto-install the toolchain pinned by
      # rust-toolchain.toml; without this step the Rust pre-commit hooks
      # fail with "toolchain is not installed".
      - name: Install Pinned Toolchain
        run: rustup toolchain install

      - name: Set Up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6

      - name: Run Pre-Commit Hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
