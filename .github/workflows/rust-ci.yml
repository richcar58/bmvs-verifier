# .github/workflows/rust-ci.yml
# Continuous integration for the verifier workspace: format, lints, build,
# and tests on pinned stable Rust (selected automatically by
# rust-toolchain.toml), on Linux and macOS per the bootstrap plan.

name: Rust CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  rust:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Pinned Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format Check
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Verify Committed Fixture
        run: |
          cargo run -q -p bmvs-verifier -- verify fixtures/mini; code=$?
          # Exit 2 = PARTIAL (proof checks staged for M1) is the expected
          # outcome; 0 becomes expected once proof verification lands.
          test "$code" -eq 2
        shell: bash

  deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  container:
    name: Container Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Build only — publishing images is a release act performed by Rich
      # (decision D9); CI proves the Dockerfile stays buildable and the
      # image actually verifies a record.
      - name: Build Image
        run: docker build -t bmvs-verifier:ci .

      - name: Smoke-Test Image Against the Committed Fixture
        run: |
          set +e
          docker run --rm -v "$PWD/fixtures/mini:/record:ro" bmvs-verifier:ci verify /record
          code=$?
          set -e
          # Exit 2 = PARTIAL, the designed outcome until M1.
          test "$code" -eq 2
