# .github/workflows/rust-ci.yml
# Continuous integration for the verifier workspace: format, lints, build,
# and tests on pinned stable Rust (selected automatically by
# rust-toolchain.toml), on Linux and macOS per the bootstrap plan.

name: Rust CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  rust:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Pinned Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format Check
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Verify Committed Fixture
        run: |
          cargo run -q -p bmvs-verifier -- verify fixtures/mini; code=$?
          # Exit 2 = PARTIAL (proof checks staged for M1) is the expected
          # outcome; 0 becomes expected once proof verification lands.
          test "$code" -eq 2
        shell: bash

  deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Pinned Toolchain
        run: rustup toolchain install

      # Prebuilt static binary, pinned by version and SHA-256 — no
      # third-party action, no per-run compilation.
      - name: Install cargo-deny
        run: |
          V=0.20.2
          SHA=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          curl -sSfL -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${V}/cargo-deny-${V}-x86_64-unknown-linux-musl.tar.gz"
          echo "${SHA}  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz --strip-components=1 \
            "cargo-deny-${V}-x86_64-unknown-linux-musl/cargo-deny"
          rm cargo-deny.tar.gz

      - name: Run cargo-deny
        run: ./cargo-deny check

  container:
    name: Container Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Build only — publishing images is a release act performed by Rich
      # (decision D9); CI proves the Dockerfile stays buildable and the
      # image actually verifies a record.
      - name: Build Image
        run: docker build -t bmvs-verifier:ci .

      - name: Smoke-Test Image Against the Committed Fixture
        run: |
          set +e
          docker run --rm -v "$PWD/fixtures/mini:/record:ro" bmvs-verifier:ci verify /record
          code=$?
          set -e
          # Exit 2 = PARTIAL, the designed outcome until M1.
          test "$code" -eq 2
